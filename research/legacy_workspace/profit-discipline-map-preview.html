          &lt;button type=&quot;button&quot; class=&quot;btn btn-block&quot; data-rule=&quot;7&quot; aria-pressed=&quot;false&quot;&gt;7 · 平仓后隔夜&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn btn-block&quot; data-rule=&quot;8&quot; aria-pressed=&quot;false&quot;&gt;8 · 净值新高后半仓&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn btn-block&quot; data-rule=&quot;9&quot; aria-pressed=&quot;false&quot;&gt;9 · 单日双向熔断&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn btn-block&quot; data-rule=&quot;10&quot; aria-pressed=&quot;false&quot;&gt;10 · 新钱3日冷静期&lt;/button&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;card pd-rule-detail&quot; aria-live=&quot;polite&quot;&gt;
      &lt;div class=&quot;pd-detail-grid&quot;&gt;
        &lt;div&gt;&lt;strong&gt;触发&lt;/strong&gt;&lt;span id=&quot;pd-rule-trigger&quot;&gt;月末已实现盈亏为正&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;strong&gt;机械动作&lt;/strong&gt;&lt;span id=&quot;pd-rule-action&quot;&gt;48小时内转出50%&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;strong&gt;切断的问题&lt;/strong&gt;&lt;span id=&quot;pd-rule-purpose&quot;&gt;利润变成下一轮更大仓位&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;profit-discipline-map&#x27;);
      if (!root) return;

      const viewButtons = Array.from(root.querySelectorAll(&#x27;[data-pd-view]&#x27;));
      const panels = Array.from(root.querySelectorAll(&#x27;[data-pd-panel]&#x27;));
      viewButtons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const selected = button.dataset.pdView;
          viewButtons.forEach((item) =&gt; {
            const active = item === button;
            item.classList.toggle(&#x27;btn-primary&#x27;, active);
            item.setAttribute(&#x27;aria-pressed&#x27;, String(active));
          });
          panels.forEach((panel) =&gt; {
            panel.hidden = panel.dataset.pdPanel !== selected;
          });
        });
      });

      const profits = [
        { label: &#x27;信用·1月&#x27;, value: 21.8 },
        { label: &#x27;信用·4月&#x27;, value: 6.9 },
        { label: &#x27;普通·4月&#x27;, value: 3.3 },
        { label: &#x27;信用·5月&#x27;, value: 12.7 },
        { label: &#x27;普通·5月&#x27;, value: 3.8 },
        { label: &#x27;信用·6月&#x27;, value: 64.0 }
      ];
      const profitTotal = profits.reduce((sum, item) =&gt; sum + item.value, 0);
      const slider = root.querySelector(&#x27;#pd-extract-rate&#x27;);
      const rateLabel = root.querySelector(&#x27;#pd-rate-label&#x27;);
      const extractedTotal = root.querySelector(&#x27;#pd-extracted-total&#x27;);
      const retainedTotal = root.querySelector(&#x27;#pd-retained-total&#x27;);
      const bars = root.querySelector(&#x27;#pd-profit-bars&#x27;);

      const renderBars = () =&gt; {
        const rate = Number(slider.value) / 100;
        rateLabel.textContent = `${Math.round(rate * 100)}%`;
        extractedTotal.textContent = `${(profitTotal * rate).toFixed(1)}万`;
        retainedTotal.textContent = `${(profitTotal * (1 - rate)).toFixed(1)}万`;
        bars.innerHTML = &#x27;&#x27;;
        profits.forEach((item) =&gt; {
          const row = document.createElement(&#x27;div&#x27;);
          row.className = &#x27;pd-bar-row&#x27;;
          const label = document.createElement(&#x27;span&#x27;);
          label.textContent = item.label;
          const track = document.createElement(&#x27;div&#x27;);
          track.className = &#x27;pd-bar-track&#x27;;
          const totalBar = document.createElement(&#x27;div&#x27;);
          totalBar.className = &#x27;pd-bar-total&#x27;;
          totalBar.style.width = `${(item.value / 64) * 100}%`;
          const extract = document.createElement(&#x27;div&#x27;);
          extract.className = &#x27;pd-bar-extract&#x27;;
          extract.style.width = `${rate * 100}%`;
          const retain = document.createElement(&#x27;div&#x27;);
          retain.className = &#x27;pd-bar-retain&#x27;;
          retain.style.width = `${(1 - rate) * 100}%`;
          totalBar.append(extract, retain);
          track.append(totalBar);
          const value = document.createElement(&#x27;span&#x27;);
          value.textContent = `${item.value.toFixed(1)}万`;
          row.append(label, track, value);
          bars.append(row);
        });
        bars.setAttribute(&#x27;aria-label&#x27;, `列出的正收益合计${profitTotal.toFixed(1)}万元，按${Math.round(rate * 100)}%转出，可锁定${(profitTotal * rate).toFixed(1)}万元`);
      };
      slider.addEventListener(&#x27;input&#x27;, renderBars);
      renderBars();

      const rules = {
        1: [&#x27;月末已实现盈亏为正&#x27;, &#x27;48小时内转出50%&#x27;, &#x27;利润变成下一轮更大仓位&#x27;],
        2: [&#x27;单笔平仓盈利超净资产2%&#x27;, &#x27;当日收工，次日转出该笔利润50%&#x27;, &#x27;大赢后当天重仓买回&#x27;],
        3: [&#x27;买入成交&#x27;, &#x27;同步挂−8%或更近结构止损&#x27;, &#x27;输单无底线和亏损拖延&#x27;],
        4: [&#x27;浮盈达+10%&#x27;, &#x27;止损上移到成本价&#x27;, &#x27;盈利交易最终变成亏损&#x27;],
        5: [&#x27;浮盈曾超过+15%&#x27;, &#x27;从最高浮盈回吐1/3时平仓&#x27;, &#x27;过早止盈与过度回吐两个极端&#x27;],
        6: [&#x27;持有满5个交易日且仍不盈利&#x27;, &#x27;第5日收盘平仓&#x27;, &#x27;短线失败后被动改成长线&#x27;],
        7: [&#x27;任何票完成平仓&#x27;, &#x27;当天禁止买回同票或同板块&#x27;, &#x27;平仓后情绪化重入&#x27;],
        8: [&#x27;账户净值创新高&#x27;, &#x27;后续10个交易日单笔仓位上限减半&#x27;, &#x27;大赢后两周内过度自信&#x27;],
        9: [&#x27;当日已实现亏损达净资产2%，或盈利达3%&#x27;, &#x27;立即停止新开仓&#x27;, &#x27;亏损连锁和赢钱上头&#x27;],
        10: [&#x27;新资金入账&#x27;, &#x27;3个交易日不使用，首周最多使用1/3&#x27;, &#x27;边跌边入金、边入边打光&#x27;]
      };
      const ruleButtons = Array.from(root.querySelectorAll(&#x27;[data-rule]&#x27;));
      const trigger = root.querySelector(&#x27;#pd-rule-trigger&#x27;);
      const action = root.querySelector(&#x27;#pd-rule-action&#x27;);
      const purpose = root.querySelector(&#x27;#pd-rule-purpose&#x27;);
      ruleButtons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          ruleButtons.forEach((item) =&gt; {
            const active = item === button;
            item.classList.toggle(&#x27;btn-primary&#x27;, active);
            item.setAttribute(&#x27;aria-pressed&#x27;, String(active));
          });
          const detail = rules[button.dataset.rule];
          trigger.textContent = detail[0];
          action.textContent = detail[1];
          purpose.textContent = detail[2];
        });
      });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
